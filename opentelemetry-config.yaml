receivers:
  otlp:
    protocols:
      http:
        endpoint: "0.0.0.0:55681"

exporters:
  
  logging:
    loglevel: "debug"
  
  otlphttp:
    endpoint: "http://host.docker.internal:4318"

  prometheus:
    endpoint: "0.0.0.0:8889"

service:
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [logging]
    traces:
      receivers: [otlp]
      exporters: [logging]
